# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Cache
        uses: actions/cache@v3.0.7
        with:
          # A list of files, directories, and wildcard patterns to cache and
          # restore.  actions/cache does not expand $HOME here, but it does
          # expand ~, so this has to be spelled with a tilde to match the
          # CACHE_DIR that scripts/vars.sh uses.
          path: ~/prog
          # Rebuild ACL2 whenever the pinned tag in vars.sh changes.
          key: acl2-${{ runner.os }}-${{ hashFiles('scripts/vars.sh') }}

      # Runs a set of commands using the runners shell
      - name: Prepare
        run: |
          mkdir -p $HOME/prog
          ./scripts/install-deps.sh
          
      # Runs a single command using the runners shell
      - name: Build
        run: ./scripts/build.sh
